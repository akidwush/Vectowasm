name: Experimental eagle local edge curvature A/B
on:
  push:
    branches: [experiment/subpixel-edge-placement-sweep, experiment/local-edge-curvature-v3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate existing DikaTrace regressions and unchanged default
        run: dotnet run --project Vecto.PaletteTests/Vecto.PaletteTests.csproj -c Release
      - name: Restore earlier user-provided test JPEG from historical commit
        run: |
          set -eu
          curl -fLsS --retry 3 \
            "https://raw.githubusercontent.com/akidwush/Vectowasm/95784a493948b88895ba7987abaed4353e08ebb2/.benchmark-temporary/original-eagle.jpg.b64" \
            -o original-eagle.jpg.b64
          base64 -d original-eagle.jpg.b64 > eagle-original.jpg
          echo "95fcc2876087edcd5af5fe2ba71f8177e77ada869aaef66bc8ccba8692c0e7e2  eagle-original.jpg" | sha256sum -c -
          rm original-eagle.jpg.b64
      - name: Experiment 50-percent crossing against raw and prepared source
        run: |
          dotnet run --project Vecto.Benchmarks/Vecto.Benchmarks.csproj -c Release -- \
            --edge-sweep --image eagle-original.jpg --output edge-results
      - name: Install normalized raster-fidelity measurement dependencies
        run: python3 -m pip install --disable-pip-version-check numpy pillow cairosvg scipy scikit-image
      - name: Re-render every SVG against JPEG ground truth
        run: |
          python3 tools/analyze_subpixel_sweep.py \
            --source eagle-original.jpg --svgs edge-results --out edge-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dikatrace-eagle-edge-sweep
          path: |
            edge-results/
            edge-audit/
          retention-days: 7
