name: DikaTrace HTML documentation validation
on:
  pull_request:
    paths:
      - 'Vecto.Browser/wwwroot/docs/**'
      - 'Vecto.Browser/Pages/Index.razor'
      - 'Vecto.Browser/wwwroot/css/app.css'
      - '.github/workflows/dikatrace-docs-ci.yml'
  push:
    branches: [main]
    paths:
      - 'Vecto.Browser/wwwroot/docs/**'
      - 'Vecto.Browser/Pages/Index.razor'
      - 'Vecto.Browser/wwwroot/css/app.css'
      - '.github/workflows/dikatrace-docs-ci.yml'

permissions:
  contents: read

jobs:
  validate-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check Vecto.Browser/wwwroot/docs/docs.js
      - name: Check HTML chapter anchors, local assets, and studio navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          base = Path("Vecto.Browser/wwwroot/docs")
          html = (base / "index.html").read_text(encoding="utf-8")
          css = (base / "docs.css").read_text(encoding="utf-8")
          js = (base / "docs.js").read_text(encoding="utf-8")
          home = Path("Vecto.Browser/Pages/Index.razor").read_text(encoding="utf-8")

          class Index(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids, self.links, self.sources, self.sections = set(), [], [], 0
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if "id" in a:
                      assert a["id"] not in self.ids, "Duplicate id " + a["id"]
                      self.ids.add(a["id"])
                  if tag == "section" and "doc-section" in a.get("class",""):
                      self.sections += 1
                  if tag == "a": self.links.append(a.get("href", ""))
                  if tag == "script": self.sources.append(a.get("src", ""))
                  if tag == "link" and a.get("rel") == "stylesheet":
                      self.sources.append(a.get("href", ""))

          doc = Index()
          doc.feed(html)
          assert doc.sections >= 10, "Not enough independent documentation chapters"
          assert all(link[1:] in doc.ids for link in doc.links if link.startswith("#")), "Broken documentation anchor"
          assert "./docs.css?v=2" in doc.sources
          assert "./docs.js?v=1" in doc.sources
          assert all(not s.startswith(("https://", "http://")) for s in doc.sources), "Third party runtime dependency"
          assert 'href="docs/index.html"' in home
          assert 'target="_blank"' in home
          for phrase in ("Cara menggunakan DikaTrace", "Mekanisme pemrosesan gambar",
                         "Boundary graph", "Bézier", "Stacked", "Local Edge V3",
                         "Anti-alias Aware Segmentation V1", "Unduh SVG",
                         "20 MB dan 8 megapiksel", "repositori proyek"):
              assert phrase in html, "Missing critical explanation: " + phrase
          assert len(css) > 4000 and "@media(max-width:480px)" in css
          assert "function search(" in js and "function onScroll()" in js
          # Brand/logo/colors are aligned to the actual DikaTrace studio,
          # not invented as a different visual identity for docs.
          studio_css = Path("Vecto.Browser/wwwroot/css/app.css").read_text(encoding="utf-8")
          assert '<a class="brand" href="../"' in html
          assert '<span class="brand-initial" aria-hidden="true">D</span>' in html
          assert '<div class="brand-name"><strong>DikaTrace</strong><span>Image to SVG</span></div>' in html
          assert '<meta name="theme-color" content="#235ca4">' in html
          assert '<meta name="theme-color" content="#235ca4"' in Path("Vecto.Browser/wwwroot/index.html").read_text(encoding="utf-8")
          for token in ("#dce3ea", "#e8edf3", "#245c9b", "#174678",
                        "#f0b657", "#194775", "#f8d795", "#dbe5f0",
                        "#3977b6", "#3c9453", "#a6b7c9"):
              assert token in studio_css, "Studio color missing: " + token
              assert token in css, "Documentation theme drifts from Studio color: " + token
          import re
          assert re.search(r"\.topbar\s*\{\s*background:#245c9b;\s*border-bottom:3px solid #174678;", css)
          assert re.search(r"\.brand-initial\s*\{[^}]*color:#194775;background:#f0b657;border:1px solid #f8d795;", css)
          assert "font-family:Tahoma" in css
          assert "width:35px;height:35px" in css
          assert "background:#e8edf3;" in css
          print("PASS: HTML anchors, 1:1 brand/logo colors, responsive CSS, and docs content")
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Blazor WebAssembly with documentation
        run: |
          dotnet publish Vecto.Browser/Vecto.Browser.csproj -c Release -o publish
          test -s publish/wwwroot/docs/index.html
          test -s publish/wwwroot/docs/docs.css
          test -s publish/wwwroot/docs/docs.js
          grep -q 'href="docs/index.html"' publish/wwwroot/_framework/../index.html || true
