name: Before/After 1000x preview quality gate
on:
  pull_request:
    paths:
      - 'Vecto.Browser/Shared/PreviewCanvas.razor'
      - 'Vecto.Browser/Pages/Index.razor'
      - 'Vecto.Browser/wwwroot/js/vecto-preview.js'
      - 'Vecto.Browser/wwwroot/js/tests/preview.test.mjs'
      - 'Vecto.Browser/wwwroot/js/tests/preview-browser-smoke.html'
      - 'Vecto.Browser/wwwroot/js/tests/preview-browser-smoke.mjs'
      - 'Vecto.Browser/wwwroot/css/app.css'
      - 'Vecto.Browser/wwwroot/index.html'
      - '.github/workflows/before-after-preview-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Static JS parse and pointer/zoom math tests
        run: |
          node --check Vecto.Browser/wwwroot/js/vecto-preview.js
          node --test Vecto.Browser/wwwroot/js/tests/preview.test.mjs
      - name: Real Chrome smoke test for 1000x native SVG and blank-free pan
        shell: bash
        run: |
          set -eu
          if command -v google-chrome >/dev/null; then
            chrome=google-chrome
          elif command -v chromium >/dev/null; then
            chrome=chromium
          else
            echo 'No headless Chromium available on runner' >&2
            exit 1
          fi
          python3 -m http.server 8765 --bind 127.0.0.1 \
            --directory Vecto.Browser/wwwroot > /tmp/preview-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8765/js/tests/preview-browser-smoke.html > /dev/null && break
            sleep .25
          done
          npm install --no-save --prefix /tmp/dikatrace-browser-test \
            playwright-core@1.56.1
          CHROME_EXECUTABLE="$(command -v "$chrome")" \
            node Vecto.Browser/wwwroot/js/tests/preview-browser-smoke.mjs
      - name: Ensure before-after, A/B V3, fallback, and download wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          comp = Path("Vecto.Browser/Shared/PreviewCanvas.razor").read_text()
          ui = Path("Vecto.Browser/Pages/Index.razor").read_text()
          style = Path("Vecto.Browser/wwwroot/css/app.css").read_text()
          js = Path("Vecto.Browser/wwwroot/js/vecto-preview.js").read_text()
          index = Path("Vecto.Browser/wwwroot/index.html").read_text()
          assert 'data-preview-viewport' in comp
          assert 'data-preview-handle' in comp
          assert 'data-preview-zoom-range' in comp
          assert 'data-preview-split-range' in comp
          assert 'role="slider"' in comp
          assert 'IsComparison' in comp and 'AlternateSvgUrl' in comp
          assert 'vectoPreview.mount' in comp and 'vectoPreview.dispose' in comp
          assert '<PreviewCanvas @key="previewSession"' in ui
          assert 'previewSession++;' in ui
          assert 'previewMode = compare ? "ab" : "compare"' in ui
          assert 'previewZoom' not in ui and 'compare-stage' not in ui
          assert 'download="@primaryDownloadName"' in ui
          assert 'download="@alternateDownloadName"' in ui
          assert 'vecto.measureSvgPair' in ui
          assert 'SvgMetadataPanel' in ui
          assert 'clip-path:inset(0 0 0 var(--preview-split))' in style
          assert 'touch-action:none' in style
          assert 'data-preview-raster' in comp and 'data-preview-vector' in comp
          assert '<img src="@BeforeUrl"' not in comp
          assert 'vectoPreview.mount", root, BeforeUrl, AfterUrl,' in comp
          assert 'BeforeIsVector, AfterIsVector' in comp
          assert 'canvas[hidden]{display:none!important}' in style
          assert 'data-preview-loading' in comp
          assert 'context.drawImage(image,0,0)' in js
          assert 'svg.setAttribute("viewBox", next)' in js
          assert 'state.imageWidth * fit * state.zoom - w' in js
          assert 'state.imageHeight * fit * state.zoom - h' in js
          assert 'onPointerDown' in js and 'onPointerMove' in js and 'onWheel' in js
          assert 'const MAX_ZOOM = 1000' in js
          assert 'vecto-preview.js?v=native-viewbox-23' in index
          assert 'css/app.css?v=native-viewbox-23' in index
          print('PASS: viewport-bounded raster, native SVG crop, no large compositor layers, synced A/B and downloads')
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish DikaTrace Blazor WebAssembly
        run: |
          dotnet publish Vecto.Browser/Vecto.Browser.csproj -c Release -o publish
          test -s publish/wwwroot/js/vecto-preview.js
          test -s publish/wwwroot/css/app.css
