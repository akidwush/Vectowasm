name: Every-image pixel preparation
on:
  pull_request:
  push:
    branches: [feat/dikatrace-auto-clean-all-images]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run adaptive palette and image preparation tests
        run: dotnet run --project Vecto.PaletteTests/Vecto.PaletteTests.csproj -c Release
      - name: Build Blazor WASM
        run: dotnet publish Vecto.Browser/Vecto.Browser.csproj -c Release -o publish
