name: Adaptive minimum palette checks
on:
  pull_request:
  push:
    branches: [feat/adaptive-minimum-palette]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test adaptive palette estimation
        run: dotnet run --project Vecto.PaletteTests/Vecto.PaletteTests.csproj -c Release
      - name: Build original Blazor WebAssembly application
        run: dotnet publish Vecto.Browser/Vecto.Browser.csproj -c Release -o publish
